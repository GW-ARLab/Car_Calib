# Raspberry Pi 5 vision stack — lane detection only, no GPIO.
# Publishes steering + drive state over MQTT (car/raspi5/control) to the
# Pi4 DataProcessingCenter, which drives the ESP32 over UART.
#
# Start:
#   cp .env.pi5 .env
#   docker compose -f docker-compose.pi5.yml up -d
#
# Dashboard:
#   http://<pi5-ip>:8080

version: "3.8"

services:
  vision:
    build:
      context: .
      dockerfile: docker/pi5/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: car-calib-pi5:latest
    container_name: car-calib-pi5
    restart: unless-stopped
    network_mode: host
    # Docker refuses to start the container if ANY listed device path is
    # missing on the host -- only list /dev/videoN nodes that actually
    # exist (`ls /dev/video*` on the Pi5). main_pi5.py's scan_cameras()/
    # acquire_camera() see indices at runtime, but only devices mapped in
    # here are even visible inside the container. Pi5's camera stack
    # (rp1-cfe/libcamera) exposes many extra ISP/metadata nodes per
    # sensor (e.g. video19-35) that are not separate cameras and are not
    # needed for OpenCV capture -- only the two actual capture nodes are
    # mapped here.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    # Absolute paths anchored at PI5_DEST_DIR, NOT relative to this compose
    # file's directory: deploy_pi5_remote.sh runs compose from
    # $PI5_DEST_DIR/current, a symlink re-pointed at a brand-new
    # releases/<version> directory on every deploy. A relative `./logs`
    # bind mount would resolve inside that versioned directory and reset
    # to empty on every deploy/reboot (old data left behind in the old
    # release dir, later pruned by the keep-3-releases cleanup).
    volumes:
      - ${PI5_DEST_DIR:-/opt/car-calib-pi5}/data/logs:/data/logs
      - ${PI5_DEST_DIR:-/opt/car-calib-pi5}/data/routes:/data/routes
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
      - BUILDKIT_INLINE_CACHE=1
      # Main loop
      - MAIN_TARGET_HZ=${MAIN_TARGET_HZ:-30}
      - MAIN_CAMERA_INDEX=${MAIN_CAMERA_INDEX:-2}
      - MAIN_CSV_LOG_FILE=${MAIN_CSV_LOG_FILE:-/data/logs/run_log.csv}
      - MAIN_FLIP_FRAME=${MAIN_FLIP_FRAME:-false}
      - MAIN_TERMINAL_LOG=${MAIN_TERMINAL_LOG:-true}
      - MAIN_DEBUG_MODE=${MAIN_DEBUG_MODE:-true}
      - MAIN_SHOW_DETECTOR_DEBUG=${MAIN_SHOW_DETECTOR_DEBUG:-true}
      # Steering (mapped to 0-180 logical angle, no GPIO on Pi5 anymore)
      - SERVO_CENTER_ANGLE=${SERVO_CENTER_ANGLE:--8}
      - MAX_STEERING_OFFSET=${MAX_STEERING_OFFSET:-60}
      # MQTT (Pi5 -> Pi4 DataProcessingCenter)
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:?Set MQTT_BROKER_HOST to the Pi4/broker address}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_RASPI5_CONTROL_TOPIC=${MQTT_RASPI5_CONTROL_TOPIC:-car/raspi5/control}
      - MANUAL_OVERRIDE_ENABLED=${MANUAL_OVERRIDE_ENABLED:-true}
      # Vision
      - ROI_HEIGHT_PCT=${ROI_HEIGHT_PCT:-0.6}
      - VISION_CANNY_LOW=${VISION_CANNY_LOW:-50}
      - VISION_CANNY_HIGH=${VISION_CANNY_HIGH:-150}
      - VISION_HOUGH_THRESHOLD=${VISION_HOUGH_THRESHOLD:-40}
      - VISION_HOUGH_MIN_LINE_LENGTH=${VISION_HOUGH_MIN_LINE_LENGTH:-40}
      - VISION_HOUGH_MAX_LINE_GAP=${VISION_HOUGH_MAX_LINE_GAP:-20}
      - VISION_MIN_ABS_SLOPE=${VISION_MIN_ABS_SLOPE:-0.3}
      - VISION_CLUSTER_ANGLE_DEG=${VISION_CLUSTER_ANGLE_DEG:-7.5}
      - VISION_CLUSTER_DIST_PX=${VISION_CLUSTER_DIST_PX:-30.0}
      # Steering
      - VP_INNER_THRESH=${VP_INNER_THRESH:-3.0}
      - VP_OUTER_THRESH=${VP_OUTER_THRESH:-8.0}
      - DANGER_MARGIN_PX=${DANGER_MARGIN_PX:-130}
      - DANGER_NUDGE_DEG=${DANGER_NUDGE_DEG:-10.0}
      - CTRL_HYSTERESIS_HIGH=${CTRL_HYSTERESIS_HIGH:-5.0}
      - CTRL_HYSTERESIS_LOW=${CTRL_HYSTERESIS_LOW:-3.0}
      - PID_KP=${PID_KP:-0.9}
      - PID_KD=${PID_KD:-0.08}
      # Dashboard
      - DASHBOARD_HOST=${DASHBOARD_HOST:-0.0.0.0}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN before exposing the LAN dashboard}
      - DASHBOARD_STREAM_MAX_CLIENTS=${DASHBOARD_STREAM_MAX_CLIENTS:-2}
      - DASHBOARD_STREAM_FPS=${DASHBOARD_STREAM_FPS:-8}
      - DASHBOARD_STREAM_JPEG_QUALITY=${DASHBOARD_STREAM_JPEG_QUALITY:-60}
      - DASHBOARD_MAX_BODY_BYTES=${DASHBOARD_MAX_BODY_BYTES:-65536}
      - DASHBOARD_REQUEST_TIMEOUT_S=${DASHBOARD_REQUEST_TIMEOUT_S:-5}
      - DASHBOARD_MAX_THREADS=${DASHBOARD_MAX_THREADS:-16}
      - DASHBOARD_ROUTE_LIST_CACHE_S=${DASHBOARD_ROUTE_LIST_CACHE_S:-5}
      - LOG_ROTATE_MB=${LOG_ROTATE_MB:-64}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-7}
      - DATA_MAX_BYTES=${DATA_MAX_BYTES:-2147483648}
      - DISK_MIN_FREE_BYTES=${DISK_MIN_FREE_BYTES:-536870912}
      - ROUTE_MAX_STEPS=${ROUTE_MAX_STEPS:-64}
      - ROUTE_MAX_STEP_DURATION_S=${ROUTE_MAX_STEP_DURATION_S:-30}
      - ROUTE_MAX_TOTAL_DURATION_S=${ROUTE_MAX_TOTAL_DURATION_S:-300}
